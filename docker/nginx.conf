server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — any path that isn't a real file falls through to
    # index.html so React Router's client-side routes work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (named "backend" in
    # docker-compose.yml's network) — mirrors the dev-server proxy in
    # frontend/vite.config.ts so the same relative /api paths work in
    # both dev and production.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
