[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpath-ai"
version = "1.0.0"
description = "CloudPath AI CLI — AI-powered cloud attack path analyzer"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.scripts]
cloudpath = "cli.main:cli"

[tool.setuptools]
packages = ["cli"]
