# ARCHITECTURE.md Section 36 deployment + Section 31 hardening:
# non-root containers (in each Dockerfile), resource limits below,
# and network isolation — postgres/redis are on an internal-only
# network with no host port mapping; only backend and frontend are
# reachable from outside.
#
# Before first run: copy .env.example to .env and set real values,
# especially JWT_SECRET_KEY and POSTGRES_PASSWORD. Then bootstrap the
# first admin user (see README.md) with:
#   docker compose exec backend python scripts/create_admin.py --username admin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudpath
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No "ports:" mapping — deliberately unreachable from the host or
    # outside the internal network, only backend/worker can reach it.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No "ports:" mapping — same isolation reasoning as postgres.

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/cloudpath
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - public
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/cloudpath
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # No "ports:" — the worker has no HTTP surface at all.

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - public
    ports:
      - "80:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  # postgres/redis/worker live here only — never exposed to "public"
  internal:
    internal: true
  # backend and frontend are reachable from outside; backend also
  # bridges into "internal" so it can reach postgres/redis
  public:

volumes:
  postgres_data:
